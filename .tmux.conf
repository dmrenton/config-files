
# ============================================================================
# tmux 3.6a configuration — best practices
# ============================================================================

# ---------------------------------------------------------------------------
# Terminal & Color Support
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ---------------------------------------------------------------------------
# Mouse Support
# ---------------------------------------------------------------------------
set -g mouse on

# ---------------------------------------------------------------------------
# General Settings
# ---------------------------------------------------------------------------
set -g history-limit 50000          # generous scrollback buffer
set -g display-time 3000            # status messages visible for 3s
set -g display-panes-time 3000      # pane indicators visible for 3s
set -sg escape-time 0               # no delay after pressing Escape (vital for vim)
set -g focus-events on              # pass focus events to applications
set -g base-index 1                 # start window numbering at 0
setw -g pane-base-index 1           # start pane numbering at 0
set -g renumber-windows on          # renumber windows when one is closed
setw -g aggressive-resize on        # resize to smallest *active* client
#set -g extended-keys always
set -g extended-keys on 
set -as terminal-features ',tmux-256:extkeys'

# Monitor activity in other windows
#setw -g monitor-activity on
# Or monitor silence (if Claude is silent for 10s, it needs input)
# setw -g monitor-silence 10

# Visually flash the status line
#set -g visual-activity on

# Optional: Customize the appearance of the alert in status bar
setw -g window-status-activity-style "fg=white,bg=red,blink"

# set bell
set -g bell-action any
set -g visual-bell off


# ---------------------------------------------------------------------------
# Prefix Key — Ctrl-a (easier to reach than default Ctrl-b)
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------------------------------------------------------------------------
# Key Bindings
# ---------------------------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Intuitive split keys (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------------
# Copy Mode (vi style)
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------------------
# Status Bar — Clean, Informative Theme
# ---------------------------------------------------------------------------
set -g status-position top
set -g status-interval 10
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e] "

# Right: host, date, time
set -g status-right-length 80
set -g status-right "#[fg=#45475a]#[fg=#cdd6f4,bg=#45475a] CPU #(top -l1 -n0 2>/dev/null | awk '/CPU usage/{print int($3+$5)}')%% MEM #(memory_pressure 2>/dev/null | awk '/percentage/{print int(100-$5)}')%% #[fg=#585b70,bg=#45475a]#[fg=#cdd6f4,bg=#585b70] %a %b %d #[fg=#89b4fa,bg=#585b70]#[fg=#1e1e2e,bg=#89b4fa,bold] %H:%M "

# Window tabs
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W #[fg=#a6e3a1,bg=#1e1e2e]"
setw -g window-status-separator ""

# ---------------------------------------------------------------------------
# Pane Borders
# ---------------------------------------------------------------------------
set -g pane-border-lines heavy
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# ---------------------------------------------------------------------------
# Message & Command Prompt Styling
# ---------------------------------------------------------------------------
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g message-command-style "bg=#fab387,fg=#1e1e2e,bold"

# ---------------------------------------------------------------------------
# Clock Mode
# ---------------------------------------------------------------------------
setw -g clock-mode-colour "#89b4fa"
setw -g clock-mode-style 24

